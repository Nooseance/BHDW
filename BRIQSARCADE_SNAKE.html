<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌭 Hotdog Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020408;--cyan:#00f5ff;--pink:#ff006e;--yellow:#ffee00;--green:#39ff14;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Orbitron',monospace;color:var(--cyan);touch-action:none;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.13) 2px,rgba(0,0,0,.13) 4px);pointer-events:none;z-index:999;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%);pointer-events:none;z-index:998;}

#wrap{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;}
#hud{display:flex;gap:clamp(8px,2vw,18px);align-items:center;padding:clamp(8px,1.5vh,14px) clamp(10px,2vw,20px);flex-shrink:0;width:100%;justify-content:center;}
.box{background:rgba(0,0,0,.6);border:1.5px solid rgba(0,245,255,.35);padding:5px 12px;font-family:'Share Tech Mono',monospace;text-align:center;}
.box-label{font-size:clamp(7px,.9vw,9px);letter-spacing:.3em;opacity:.4;margin-bottom:2px;}
.box-val{font-size:clamp(13px,2.2vw,20px);font-weight:700;text-shadow:0 0 8px var(--cyan);}

#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%;position:relative;}
canvas{display:block;border:1px solid rgba(0,245,255,.2);box-shadow:0 0 20px rgba(0,245,255,.08);image-rendering:crisp-edges;}

/* D-pad */
#dpad{display:none;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px;flex-shrink:0;}
@media(pointer:coarse){#dpad{display:flex;}}
.dpad-row{display:flex;gap:4px;}
.dbtn{width:clamp(44px,10vw,58px);height:clamp(44px,10vw,58px);border:1.5px solid rgba(0,245,255,.45);border-radius:8px;background:rgba(0,245,255,.05);color:var(--cyan);font-size:clamp(16px,3.5vw,22px);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .1s,transform .08s;}
.dbtn:active{background:rgba(0,245,255,.2);transform:scale(.9);}

.overlay{position:absolute;inset:0;background:rgba(2,4,8,.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,18px);backdrop-filter:blur(2px);}
.overlay.hidden{display:none;}
.ov-title{font-size:clamp(28px,6vw,64px);font-weight:900;letter-spacing:.15em;color:var(--cyan);text-shadow:0 0 10px var(--cyan),0 0 30px var(--cyan),0 0 60px rgba(0,245,255,.5);animation:pulse 2s ease-in-out infinite;text-align:center;}
.ov-sub{font-family:'Share Tech Mono',monospace;font-size:clamp(10px,1.8vw,14px);letter-spacing:.15em;opacity:.6;text-align:center;line-height:2;padding:0 20px;animation:blink 1s step-end infinite;}
.btn{padding:12px 32px;border:2px solid var(--cyan);background:transparent;color:var(--cyan);font-family:'Orbitron',monospace;font-size:clamp(11px,1.8vw,15px);font-weight:700;letter-spacing:.2em;cursor:pointer;text-transform:uppercase;box-shadow:0 0 8px var(--cyan),0 0 20px var(--cyan),0 0 40px rgba(0,245,255,.4);transition:all .2s;}
.btn:hover{background:rgba(0,245,255,.08);}
.home-link{font-family:'Share Tech Mono',monospace;font-size:clamp(9px,1.4vw,12px);color:var(--cyan);opacity:.35;text-decoration:none;letter-spacing:.2em;transition:opacity .2s;position:absolute;bottom:16px;}
.home-link:hover{opacity:.8;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="box"><div class="box-label">SCORE</div><div class="box-val" id="sc">0</div></div>
    <div class="box"><div class="box-label">BEST</div><div class="box-val" id="bs">0</div></div>
    <div class="box"><div class="box-label">LEVEL</div><div class="box-val" id="lv">1</div></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="overlay" id="ov">
      <div class="ov-title">🌭 HOTDOG<br>SNAKE</div>
      <div class="ov-sub">Arrow keys or D-pad to move<br>Collect 🌭 to grow · Don't bite yourself!</div>
      <button class="btn" id="sb">INSERT COIN</button>
      <a class="home-link" href="launcher.html">← ARCADE</a>
    </div>
  </div>
  <div id="dpad">
    <div class="dpad-row"><div class="dbtn" id="du">▲</div></div>
    <div class="dpad-row">
      <div class="dbtn" id="dl">◀</div>
      <div class="dbtn" id="dd">▼</div>
      <div class="dbtn" id="dr">▶</div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let CELL,COLS,ROWS,CW,CH;

function resize(){
  const wrap=document.getElementById('canvas-wrap');
  const maxW=wrap.clientWidth;const maxH=wrap.clientHeight;
  const size=Math.min(maxW,maxH,520);
  CELL=Math.floor(size/21);COLS=21;ROWS=21;
  CW=CELL*COLS;CH=CELL*ROWS;
  canvas.width=CW;canvas.height=CH;
}
window.addEventListener('resize',()=>{resize();});resize();

let snake,dir,nextDir,food,score,best=0,level,speed,loop,state='idle';

// ── Image loading ──────────────────────────────────────────────────────────
// Drop these PNGs in an "Images" folder next to this HTML file:
//   Images/snake_head.png  – the head tile (drawn rotated to face movement dir)
//   Images/snake_body.png  – one body tile, tiled for every segment after the head
// Missing files silently fall back to the built-in neon style.
const IMG = {};
(function(){
  ['head','body'].forEach(key => {
    const i = new Image();
    i.onload  = () => { IMG[key] = i; };
    i.src = `Images/snake_${key}.png`;
  });
})();

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;level=1;speed=160;
  placeFood();updateHUD();
}
function placeFood(){
  let pos;
  do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}
function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('bs').textContent=best;
  document.getElementById('lv').textContent=level;
}

function step(){
  dir=nextDir;
  const head={x:(snake[0].x+dir.x+COLS)%COLS,y:(snake[0].y+dir.y+ROWS)%ROWS};
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10*level;if(score>best)best=score;
    if(score%(50*level)===0){level++;speed=Math.max(60,speed-15);restartLoop();}
    placeFood();
  } else {snake.pop();}
  updateHUD();draw();
}

function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#020408';ctx.fillRect(0,0,CW,CH);
  // Grid
  ctx.strokeStyle='rgba(0,245,255,0.05)';ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,CH);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(CW,y*CELL);ctx.stroke();}
  // Food
  const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
  ctx.save();ctx.shadowColor='#ffee00';ctx.shadowBlur=14;
  ctx.font=`${CELL+2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🌭',fx,fy);ctx.restore();
  // Snake
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i];const x=s.x*CELL+1,y=s.y*CELL+1,sz=CELL-2;
    if(i===0){
      // Head
      if(IMG.head){
        ctx.save();
        // Rotate image to face direction of travel
        const angle = dir.x===1?0 : dir.x===-1?Math.PI : dir.y===1?Math.PI/2 : -Math.PI/2;
        ctx.translate(x+sz/2, y+sz/2);
        ctx.rotate(angle);
        ctx.shadowColor='#FCA311';ctx.shadowBlur=12;
        ctx.drawImage(IMG.head, -sz/2, -sz/2, sz, sz);
        ctx.restore();
      } else {
        ctx.fillStyle='#FCA311';ctx.shadowColor='#FCA311';ctx.shadowBlur=12;
        ctx.beginPath();ctx.roundRect(x,y,sz,sz,5);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle='#fff';
        const ex=x+sz/2+(dir.y!==0?-3:0)+(dir.x>0?sz-5:2);
        const ey=y+sz/2+(dir.x!==0?-3:0)+(dir.y>0?sz-5:2);
        ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex,ey,1,0,Math.PI*2);ctx.fill();
      }
    } else {
      // Body
      if(IMG.body){
        ctx.save();
        ctx.shadowColor='#DC2F02';ctx.shadowBlur=6;
        ctx.drawImage(IMG.body, x, y, sz, sz);
        ctx.restore();
      } else {
        ctx.fillStyle=i%2===0?'#DC2F02':'#C1440E';ctx.shadowBlur=0;
        ctx.beginPath();ctx.roundRect(x,y,sz,sz,2);ctx.fill();
      }
    }
  }
  ctx.shadowBlur=0;
}

function gameOver(){
  clearInterval(loop);state='dead';
  const ov=document.getElementById('ov');ov.classList.remove('hidden');
  ov.querySelector('.ov-title').innerHTML=`GAME<br>OVER 💀`;
  ov.querySelector('.ov-sub').textContent='PRESS PLAY AGAIN OR SPACE';
  document.getElementById('sb').textContent='▶ PLAY AGAIN';
}

function restartLoop(){clearInterval(loop);loop=setInterval(step,speed);}

function startGame(){
  document.getElementById('ov').classList.add('hidden');
  state='playing';init();restartLoop();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){if(state!=='playing'){startGame();}return;}
  if(state!=='playing')return;
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const d=map[e.key];
  if(d&&!(d.x===-dir.x&&d.y===0)&&!(d.y===-dir.y&&d.x===0)){nextDir=d;e.preventDefault();}
});

function tryDir(d){
  if(state!=='playing'){startGame();return;}
  if(!(d.x===-dir.x&&d.y===0)&&!(d.y===-dir.y&&d.x===0))nextDir=d;
}

document.getElementById('du').addEventListener('click',()=>tryDir({x:0,y:-1}));
document.getElementById('dd').addEventListener('click',()=>tryDir({x:0,y:1}));
document.getElementById('dl').addEventListener('click',()=>tryDir({x:-1,y:0}));
document.getElementById('dr').addEventListener('click',()=>tryDir({x:1,y:0}));
canvas.addEventListener('click',()=>{if(state!=='playing')startGame();});

// Swipe support
let sx,sy;
canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<10&&Math.abs(dy)<10){if(state!=='playing')startGame();return;}
  if(Math.abs(dx)>Math.abs(dy))tryDir({x:dx>0?1:-1,y:0});
  else tryDir({x:0,y:dy>0?1:-1});
},{passive:true});

document.getElementById('sb').addEventListener('click',startGame);
draw();
</script>
</body>
</html>
