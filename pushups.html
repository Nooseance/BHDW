<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌭 Bad_Hotdog_Water's Pushup Bonanza 🌭</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Titan+One&display=swap');

  :root {
    --mustard: #F5C518;
    --ketchup: #C0392B;
    --bun: #D4853A;
    --bun-dark: #A0622A;
    --wiener: #B85C38;
    --sky: #87CEEB;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(180deg, #FFD166 0%, #FF6B35 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Boogaloo', cursive;
    overflow: hidden;
    user-select: none;
    padding: 20px;
  }

  h1 {
    font-size: clamp(1.3rem, 3.5vw, 2.8rem);
    color: #fff;
    text-shadow: 4px 4px 0px #C0392B, 6px 6px 0px rgba(0,0,0,0.2);
    letter-spacing: 2px;
    margin-bottom: 6px;
    animation: bounce-title 2s ease-in-out infinite;
    text-align: center;
  }

  @keyframes bounce-title {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .subtitle {
    color: rgba(255,255,255,0.9);
    font-size: 1rem;
    margin-bottom: 14px;
    letter-spacing: 1px;
    text-align: center;
  }

  /* ── Main layout ── */
  .main-layout {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ── Game area ── */
  .game-area {
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 60%, #4CAF50 60%, #388E3C 100%);
    border-radius: 24px;
    width: min(440px, 85vw);
    height: 290px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
    border: 4px solid rgba(255,255,255,0.5);
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* ── COACH ── */
  .coach-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
    width: 150px;
  }

  .speech-bubble {
    background: #fff;
    border: 3px solid #2C1810;
    border-radius: 16px;
    padding: 10px 12px;
    width: 148px;
    text-align: center;
    font-size: 0.9rem;
    color: #2C1810;
    line-height: 1.35;
    position: relative;
    box-shadow: 3px 3px 0 #2C1810;
    opacity: 0;
    transform: scale(0.85) translateY(4px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    margin-bottom: 12px;
    word-break: break-word;
  }

  .speech-bubble.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  /* Bubble tail pointing down */
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 13px solid #fff;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -17px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 17px solid #2C1810;
    z-index: -1;
  }

  .coach-img-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3), 0 0 0 3px #C0392B;
    overflow: hidden;
    background: linear-gradient(135deg, #C0392B, #8B1A0A);
    flex-shrink: 0;
    animation: coach-idle 3s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .coach-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .coach-img-wrap .fallback-emoji {
    font-size: 2.8rem;
    display: none;
  }

  .coach-img-wrap.pumped {
    animation: coach-pump 0.4s ease-out !important;
  }

  @keyframes coach-idle {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-5px) rotate(1deg); }
  }
  @keyframes coach-pump {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.18) rotate(-4deg); }
    65%  { transform: scale(0.94) rotate(2deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .coach-label {
    font-family: 'Titan One', cursive;
    font-size: 0.75rem;
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    margin-top: 7px;
    letter-spacing: 2px;
  }

  /* ── Clouds ── */
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.8;
  }
  .cloud::before, .cloud::after { content: ''; background: white; border-radius: 50%; position: absolute; }
  .cloud1 { width: 80px; height: 25px; top: 28px; left: 28px; animation: float-cloud 12s linear infinite; }
  .cloud1::before { width: 35px; height: 35px; top: -18px; left: 10px; }
  .cloud1::after  { width: 25px; height: 25px; top: -12px; left: 35px; }
  .cloud2 { width: 60px; height: 20px; top: 52px; right: 36px; animation: float-cloud 18s linear infinite reverse; }
  .cloud2::before { width: 28px; height: 28px; top: -15px; left: 8px; }
  .cloud2::after  { width: 20px; height: 20px; top: -10px; left: 28px; }

  @keyframes float-cloud {
    0%   { transform: translateX(0); }
    50%  { transform: translateX(20px); }
    100% { transform: translateX(0); }
  }

  .ground-line {
    position: absolute;
    bottom: 55px; left: 0; right: 0;
    height: 3px;
    background: rgba(0,0,0,0.15);
  }

  /* ── HOTDOG ── */
  .hotdog-wrapper {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: bottom 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .hotdog-wrapper.down { bottom: 30px; }

  .hotdog { position: relative; width: 140px; height: 60px; }

  .bun-top {
    position: absolute;
    top: 0; left: 0; right: 0; height: 28px;
    background: radial-gradient(ellipse at 50% 40%, #F0A858 0%, var(--bun) 60%, var(--bun-dark) 100%);
    border-radius: 70px 70px 0 0;
    box-shadow: 0 -3px 8px rgba(0,0,0,0.1);
  }

  .seed { position: absolute; width: 6px; height: 3px; background: #C8892A; border-radius: 50%; }
  .seed:nth-child(1) { top: 6px; left: 25px; transform: rotate(10deg); }
  .seed:nth-child(2) { top: 4px; left: 55px; transform: rotate(-15deg); }
  .seed:nth-child(3) { top: 7px; left: 80px; transform: rotate(20deg); }
  .seed:nth-child(4) { top: 10px; left: 105px; transform: rotate(-5deg); }

  .sausage {
    position: absolute;
    top: 16px; left: 8px; right: 8px; height: 28px;
    background: radial-gradient(ellipse at 40% 35%, #D4785A 0%, var(--wiener) 70%, #8B3A20 100%);
    border-radius: 14px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 2px 6px rgba(0,0,0,0.2);
  }

  .mustard { position: absolute; top: 20px; left: 15px; right: 15px; height: 8px; z-index: 5; }
  .mustard svg { width: 100%; height: 100%; }

  .bun-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 20px;
    background: radial-gradient(ellipse at 50% 60%, #E09848 0%, var(--bun-dark) 100%);
    border-radius: 0 0 70px 70px;
  }

  .arms { position: absolute; top: 22px; left: -30px; right: -30px; height: 18px; pointer-events: none; }
  .arm {
    position: absolute;
    width: 28px; height: 12px;
    background: radial-gradient(ellipse, #E09848 0%, var(--bun-dark) 100%);
    border-radius: 6px; top: 0;
    transition: transform 0.12s ease;
  }
  .arm.left  { left: 0;  transform-origin: right center; transform: rotate(-20deg); }
  .arm.right { right: 0; transform-origin: left center;  transform: rotate(20deg); }
  .hotdog-wrapper.down .arm.left  { transform: rotate(40deg) translateY(4px); }
  .hotdog-wrapper.down .arm.right { transform: rotate(-40deg) translateY(4px); }

  .eyes {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px; z-index: 20;
  }
  .eye {
    width: 10px; height: 10px; background: #2C1810; border-radius: 50%;
    position: relative; animation: blink 4s ease-in-out infinite;
    transition: transform 0.12s ease;
  }
  .eye::after {
    content: ''; position: absolute; width: 3px; height: 3px;
    background: white; border-radius: 50%; top: 1px; left: 2px;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
  .hotdog-wrapper.down .eye { transform: scaleY(0.6); }

  .sweat {
    position: absolute; width: 8px; height: 12px;
    background: var(--sky); border-radius: 0 50% 50% 50%;
    opacity: 0; transition: opacity 0.2s;
  }
  .sweat.left  { top: -5px; left: -18px;  transform: rotate(225deg); }
  .sweat.right { top: -5px; right: -18px; transform: rotate(-45deg); }
  .hotdog-wrapper.down .sweat { opacity: 1; animation: sweat-fly 0.5s ease-out forwards; }
  @keyframes sweat-fly {
    0%   { opacity: 1; transform: rotate(-45deg) translate(0,0); }
    100% { opacity: 0; transform: rotate(-45deg) translate(-15px,-20px); }
  }

  .shadow {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 12px; background: rgba(0,0,0,0.2);
    border-radius: 50%; transition: all 0.12s ease; filter: blur(3px);
  }
  .shadow.compressed { width: 130px; height: 8px; bottom: 32px; }

  /* ── UI panel ── */
  .ui-panel {
    display: flex; align-items: center; gap: 18px;
    margin-top: 14px; flex-wrap: wrap; justify-content: center;
  }

  .counter-box {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255,255,255,0.5);
    border-radius: 16px; padding: 10px 26px;
    text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .counter-label { font-size: 0.8rem; color: rgba(255,255,255,0.8); letter-spacing: 2px; text-transform: uppercase; }
  .counter-num {
    font-family: 'Titan One', cursive; font-size: 3rem;
    color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); line-height: 1;
  }
  .counter-num.pop { animation: num-pop 0.2s ease-out; }
  @keyframes num-pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.3); color: var(--mustard); }
    100% { transform: scale(1); }
  }

  .reset-btn {
    font-family: 'Boogaloo', cursive; font-size: 1.3rem; padding: 12px 24px;
    background: var(--ketchup); color: white; border: none; border-radius: 14px;
    cursor: pointer; box-shadow: 0 6px 0 #8B1A0A, 0 8px 20px rgba(0,0,0,0.2);
    transition: all 0.1s ease; letter-spacing: 1px;
  }
  .reset-btn:hover  { background: #E74C3C; transform: translateY(-2px); box-shadow: 0 8px 0 #8B1A0A; }
  .reset-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8B1A0A; }

  .hint {
    color: rgba(255,255,255,0.75); font-size: 0.9rem; margin-top: 8px;
    letter-spacing: 1px; animation: pulse-hint 2s ease-in-out infinite; text-align: center;
  }
  @keyframes pulse-hint { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

  /* ── Milestone ── */
  .milestone {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: 'Titan One', cursive; font-size: clamp(1.8rem, 5vw, 3rem);
    color: white; text-shadow: 3px 3px 0 var(--ketchup);
    text-align: center; pointer-events: none; z-index: 100;
  }
  .milestone.show { animation: milestone-anim 1.2s ease-out forwards; }
  @keyframes milestone-anim {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-10deg); opacity: 1; }
    30%  { transform: translate(-50%,-50%) scale(1.1) rotate(3deg);  opacity: 1; }
    60%  { transform: translate(-50%,-50%) scale(1) rotate(0deg);    opacity: 1; }
    85%  { transform: translate(-50%,-50%) scale(1) rotate(0deg);    opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(0.8) rotate(5deg);  opacity: 0; }
  }

  /* ── Particles ── */
  .particle {
    position: fixed; pointer-events: none; font-size: 1.5rem; z-index: 50;
    animation: particle-fly 1s ease-out forwards;
  }
  @keyframes particle-fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<h1>🌭 Bad_Hotdog_Water's Pushup Bonanza 🌭</h1>
<p class="subtitle">The world's most athletic HotDog</p>

<div class="main-layout">

  <!-- ── Game ── -->
  <div class="game-area" id="gameArea">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="ground-line"></div>
    <div class="shadow" id="shadow"></div>

    <div class="hotdog-wrapper" id="hotdog">
      <div class="hotdog">
        <div class="sweat left"></div>
        <div class="sweat right"></div>
        <div class="bun-top">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="seed"></div><div class="seed"></div>
          <div class="seed"></div><div class="seed"></div>
        </div>
        <div class="mustard">
          <svg viewBox="0 0 110 8" preserveAspectRatio="none">
            <path d="M0,4 Q14,1 28,4 Q42,7 56,4 Q70,1 84,4 Q98,7 110,4"
                  fill="none" stroke="#F5C518" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="sausage"></div>
        <div class="bun-bottom"></div>
        <div class="arms">
          <div class="arm left"></div>
          <div class="arm right"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Coach BRIQ ── -->
  <div class="coach-area">
    <div class="speech-bubble" id="speechBubble">Ready to grind! 💪</div>
    <div class="coach-img-wrap" id="coachImg">
      <img src=".\Images\BRIQ.png" alt="Coach BRIQ"
           onerror="this.style.display='none'; document.getElementById('coachFallback').style.display='block';">
      <span class="fallback-emoji" id="coachFallback">🏋️</span>
    </div>
    <div class="coach-label">COACH BRIQ</div>
  </div>

</div>

<div class="ui-panel">
  <div class="counter-box">
    <div class="counter-label">Pushups</div>
    <div class="counter-num" id="counter">0</div>
  </div>
  <button class="reset-btn" id="resetBtn">🔄 Reset</button>
</div>

<p class="hint">Press SPACEBAR or tap the field to do a pushup!</p>

<div class="milestone" id="milestone"></div>

<script>
  const hotdog      = document.getElementById('hotdog');
  const shadow      = document.getElementById('shadow');
  const counterEl   = document.getElementById('counter');
  const resetBtn    = document.getElementById('resetBtn');
  const milestoneEl = document.getElementById('milestone');
  const bubble      = document.getElementById('speechBubble');
  const coachImg    = document.getElementById('coachImg');

  let count = 0;
  let isDown = false;
  let bubbleTimer = null;

  // ── Coach dialogue ──────────────────────────────────────
  const idleLines = [
    "Ready to grind! 💪",
    "Let's GET IT! 🔥",
    "Hotdogs don't quit! 🌭",
    "I believe in you! ⚡",
    "Stay focused, champ! 👀",
    "You were BORN for this! 🌟",
    "Hit that spacebar! 🎮",
    "Let's warm those buns up! 🌭🔥"
  ];

  const repLines = [
    "NICE REP! 💪",
    "Keep pushin'! 🔥",
    "That's the one! 🌭",
    "FEEL THE BURN! 😤",
    "Beautiful form! ✨",
    "Don't stop now! ⚡",
    "YES! Again! 🎯",
    "Sizzlin'! 🔥",
    "You're on FIRE! 🌭🔥",
    "INCREDIBLE! 💥",
    "More! MORE! 😤",
    "That's my athlete! 🏆"
  ];

  const milestoneCoachLines = {
    1:   "FIRST ONE! Now don't stop! 🔥",
    5:   "5 reps! You're warming up! 🌭",
    10:  "10 PUSHUPS! This dog CAN COOK! 🍳",
    25:  "25?! BEAST MODE!! I'm proud! 🐉",
    50:  "FIFTY REPS?! You're INSANE! 🤯",
    100: "100!!! You are an ABSOLUTE LEGEND! 👑🌭"
  };

  function showBubble(text, duration = 2200) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('visible');
    bubbleTimer = setTimeout(() => bubble.classList.remove('visible'), duration);
  }

  function pumpCoach() {
    coachImg.classList.remove('pumped');
    void coachImg.offsetWidth;
    coachImg.classList.add('pumped');
    setTimeout(() => coachImg.classList.remove('pumped'), 500);
  }

  // Idle chatter when at 0 reps
  setInterval(() => {
    if (!isDown && count === 0) {
      showBubble(idleLines[Math.floor(Math.random() * idleLines.length)], 2600);
    }
  }, 6000);

  // First greeting
  setTimeout(() => showBubble("Alright, let's GO! 🌭💪", 3000), 900);

  // ── Game logic ──────────────────────────────────────────
  function doDown() {
    if (isDown) return;
    isDown = true;
    hotdog.classList.add('down');
    shadow.classList.add('compressed');
  }

  function doUp() {
    if (!isDown) return;
    isDown = false;
    hotdog.classList.remove('down');
    shadow.classList.remove('compressed');

    count++;
    counterEl.textContent = count;
    counterEl.classList.remove('pop');
    void counterEl.offsetWidth;
    counterEl.classList.add('pop');

    spawnParticles();
    pumpCoach();

    if (milestoneCoachLines[count]) {
      showBubble(milestoneCoachLines[count], 3200);
      showMilestone(getMilestoneText(count));
    } else {
      showBubble(repLines[Math.floor(Math.random() * repLines.length)], 1800);
    }
  }

  function getMilestoneText(n) {
    const t = { 1:"Let's GO! 💪", 5:"5 REPS! 🔥", 10:"10 PUSHUPS! 🌭💪",
                25:"BEAST MODE! 🏋️", 50:"50!!! ARE YOU SERIOUS?! 🤯", 100:"100 PUSHUPS! LEGENDARY! 👑" };
    return t[n] || '';
  }

  function spawnParticles() {
    const rect = hotdog.getBoundingClientRect();
    const emojis = ['🌭','💪','🔥','⚡','✨'];
    for (let i = 0; i < 5; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const dx = (Math.random() - 0.5) * 200;
      const dy = -(Math.random() * 150 + 50);
      p.style.cssText = `left:${rect.left+rect.width/2}px;top:${rect.top}px;--dx:${dx}px;--dy:${dy}px;animation-delay:${Math.random()*0.2}s`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  function showMilestone(text) {
    if (!text) return;
    milestoneEl.textContent = text;
    milestoneEl.classList.remove('show');
    void milestoneEl.offsetWidth;
    milestoneEl.classList.add('show');
    setTimeout(() => milestoneEl.classList.remove('show'), 1300);
  }

  function reset() {
    count = 0;
    counterEl.textContent = '0';
    hotdog.classList.remove('down');
    shadow.classList.remove('compressed');
    isDown = false;
    pumpCoach();
    showMilestone('Reset! 💔');
    showBubble("Okay! From the TOP! Let's GO! 😤🌭", 2800);
  }

  // ── Input ──────────────────────────────────────────────
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); doDown(); } });
  document.addEventListener('keyup',   e => { if (e.code === 'Space') { e.preventDefault(); doUp(); } });

  const gameArea = document.getElementById('gameArea');
  gameArea.addEventListener('mousedown', doDown);
  gameArea.addEventListener('mouseup', doUp);
  gameArea.addEventListener('touchstart', e => { e.preventDefault(); doDown(); }, { passive: false });
  gameArea.addEventListener('touchend',   e => { e.preventDefault(); doUp(); },   { passive: false });

  resetBtn.addEventListener('click', reset);
</script>
</body>
</html>
